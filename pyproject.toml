[project]
name = "hass-agents"
version = "0.1.0"
description = "Multi-agent consumption analysis for Home Assistant — propose reports, never direct-control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
llm = [
    "crewai>=0.120.0; python_version < '3.14'",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
hass-agents = "hass_agents.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hass_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
