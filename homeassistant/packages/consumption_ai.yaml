# Optional Home Assistant package — schedules + notify only.
# Sensors are created automatically via MQTT discovery when `hass-agents serve` starts
# (device « Hass Agents », entities sensor.house_ai_conso_*).
# Copy into config/packages/ only if you want HA to request reports / notify on anomalies.

automation:
  - id: house_ai_consumption_daily_request
    alias: "House AI — demande rapport conso quotidien"
    trigger:
      - platform: time
        at: "21:00:00"
    action:
      - service: mqtt.publish
        data:
          topic: house/agents/consumption/request
          payload: '{"period":"daily"}'

  - id: house_ai_consumption_weekly_request
    alias: "House AI — demande rapport conso hebdo"
    trigger:
      - platform: time
        at: "21:05:00"
    condition:
      - condition: time
        weekday:
          - sun
    action:
      - service: mqtt.publish
        data:
          topic: house/agents/consumption/request
          payload: '{"period":"weekly"}'

  - id: house_ai_consumption_monthly_request
    alias: "House AI — demande rapport conso mensuel"
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - service: mqtt.publish
        data:
          topic: house/agents/consumption/request
          payload: '{"period":"monthly"}'

  - id: house_ai_consumption_notify_on_warn
    alias: "House AI — notification si anomalie conso"
    trigger:
      - platform: mqtt
        topic: house/agents/consumption/report/daily
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.severity in ['warn', 'critical'] }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Anomalie consommation"
          message: "{{ trigger.payload_json.headline }}\n\n{{ trigger.payload_json.summary }}"
          notification_id: house_ai_consumption_anomaly
